<svg xmlns="http://www.w3.org/2000/svg" width="680" height="620" viewBox="0 0 680 620" font-family="Helvetica, Arial, sans-serif" role="img"><title>HeatWatch agent stack with injection points</title><desc>Tenant text enters an input guard, then a model under a system prompt that calls one read-only lookup tool; triage and output gates run in code; results go to tenant, ticket store and reviewer queue, looping back to follow-ups.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="680" height="620" fill="#FFFFFF"/><rect x="20" y="100" width="610" height="362" rx="12" fill="none" stroke="#888780" stroke-dasharray="6 4"/><text x="36" y="120" font-size="14" font-weight="bold" fill="#2C2C2A">Harness (code)</text><rect x="110" y="30" width="180" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="200.0" y="50.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="bold" fill="#2C2C2A">Tenant message</text><text x="200.0" y="69.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">free text, address</text><rect x="360" y="30" width="180" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="450.0" y="50.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="bold" fill="#2C2C2A">Ticket follow-up</text><text x="450.0" y="69.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">reopen, added info</text><line x1="200" y1="86" x2="290" y2="124" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/><line x1="450" y1="86" x2="360" y2="124" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/><rect x="240" y="126" width="170" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text x="325.0" y="146.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="bold" fill="#04342C">Input guard</text><text x="325.0" y="165.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">schema and scope</text><line x1="325" y1="182" x2="325" y2="212" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/><rect x="36" y="214" width="160" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="116.0" y="234.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="bold" fill="#2C2C2A">System prompt</text><text x="116.0" y="253.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">fixed role, rules</text><rect x="240" y="214" width="170" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="325.0" y="234.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="bold" fill="#2C2C2A">Model (LLM)</text><text x="325.0" y="253.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">no write access</text><rect x="456" y="214" width="160" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text x="536.0" y="234.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="bold" fill="#04342C">lookup_complaints</text><text x="536.0" y="253.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">structured fields</text><line x1="196" y1="242" x2="238" y2="242" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/><line x1="412" y1="242" x2="454" y2="242" stroke="#5F5E5A" stroke-width="1.5" marker-start="url(#a)" marker-end="url(#a)"/><line x1="536" y1="270" x2="536" y2="300" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/><line x1="325" y1="270" x2="325" y2="300" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/><rect x="456" y="302" width="160" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="536.0" y="322.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="bold" fill="#2C2C2A">Complaint cache</text><text x="536.0" y="341.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">40k rows, SQLite</text><rect x="240" y="302" width="170" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text x="325.0" y="322.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="bold" fill="#04342C">Triage engine</text><text x="325.0" y="341.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">priority set in code</text><line x1="325" y1="358" x2="325" y2="388" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/><rect x="240" y="390" width="170" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text x="325.0" y="410.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="bold" fill="#04342C">Output gate</text><text x="325.0" y="429.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">fixed templates</text><line x1="412" y1="418" x2="454" y2="418" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/><rect x="456" y="390" width="160" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="536.0" y="410.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="bold" fill="#2C2C2A">Ticket store</text><text x="536.0" y="429.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">harness writes only</text><line x1="325" y1="446" x2="325" y2="498" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/><line x1="536" y1="446" x2="531" y2="498" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#a)"/><rect x="240" y="500" width="170" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="325.0" y="520.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="bold" fill="#2C2C2A">Tenant reply</text><text x="325.0" y="539.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">plain language, ETA</text><rect x="456" y="500" width="150" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text x="531.0" y="520.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="bold" fill="#04342C">Reviewer queue</text><text x="531.0" y="539.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">text shown quoted</text><path d="M606 528 L655 528 L655 58 L546 58" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a)"/><text x="600" y="48" text-anchor="middle" font-size="12" fill="#5F5E5A">Loopback</text><circle cx="110" cy="30" r="11" fill="#FAEEDA" stroke="#854F0B"/><text x="110" y="30" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="bold" fill="#412402">1</text><circle cx="360" cy="30" r="11" fill="#FAEEDA" stroke="#854F0B"/><text x="360" y="30" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="bold" fill="#412402">2</text><circle cx="616" cy="214" r="11" fill="#FAEEDA" stroke="#854F0B"/><text x="616" y="214" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="bold" fill="#412402">3</text><circle cx="456" cy="500" r="11" fill="#FAEEDA" stroke="#854F0B"/><text x="456" y="500" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="bold" fill="#412402">4</text><rect x="40" y="584" width="14" height="14" rx="3" fill="#E1F5EE" stroke="#0F6E56"/><text x="62" y="591" dominant-baseline="central" font-size="12" fill="#444441">Harness control</text><circle cx="240" cy="591" r="7" fill="#FAEEDA" stroke="#854F0B"/><text x="254" y="591" dominant-baseline="central" font-size="12" fill="#444441">Numbered entry point: untrusted text, partly caught</text></svg>