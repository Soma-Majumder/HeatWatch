<svg xmlns="http://www.w3.org/2000/svg" width="680" height="480" viewBox="0 0 680 480" font-family="Helvetica, Arial, sans-serif" role="img"><title>HeatWatch triage thresholds</title><desc>Score scale with four priority bands, points per signal, and three overrides that make a complaint critical regardless of score.</desc><rect width="680" height="480" fill="#FFFFFF"/><text x="40" y="36" font-size="14" font-weight="bold" fill="#2C2C2A">Priority by score</text><rect x="40" y="52" width="180" height="48" rx="4" fill="#F1EFE8" stroke="#5F5E5A"/><text x="130.0" y="68" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="bold" fill="#2C2C2A">Low</text><text x="130.0" y="86" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">under 3</text><rect x="220" y="52" width="120" height="48" rx="4" fill="#E1F5EE" stroke="#0F6E56"/><text x="280.0" y="68" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="bold" fill="#04342C">Normal</text><text x="280.0" y="86" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">3 to 4</text><rect x="340" y="52" width="180" height="48" rx="4" fill="#FAEEDA" stroke="#854F0B"/><text x="430.0" y="68" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="bold" fill="#412402">High</text><text x="430.0" y="86" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#854F0B">5 to 7</text><rect x="520" y="52" width="120" height="48" rx="4" fill="#FCEBEB" stroke="#A32D2D"/><text x="580.0" y="68" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="bold" fill="#501313">Critical</text><text x="580.0" y="86" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#A32D2D">8 or more</text><text x="40" y="118" text-anchor="middle" font-size="12" fill="#5F5E5A">0</text><text x="100" y="118" text-anchor="middle" font-size="12" fill="#5F5E5A">1</text><text x="160" y="118" text-anchor="middle" font-size="12" fill="#5F5E5A">2</text><text x="220" y="118" text-anchor="middle" font-size="12" fill="#5F5E5A">3</text><text x="280" y="118" text-anchor="middle" font-size="12" fill="#5F5E5A">4</text><text x="340" y="118" text-anchor="middle" font-size="12" fill="#5F5E5A">5</text><text x="400" y="118" text-anchor="middle" font-size="12" fill="#5F5E5A">6</text><text x="460" y="118" text-anchor="middle" font-size="12" fill="#5F5E5A">7</text><text x="520" y="118" text-anchor="middle" font-size="12" fill="#5F5E5A">8</text><text x="580" y="118" text-anchor="middle" font-size="12" fill="#5F5E5A">9</text><text x="640" y="118" text-anchor="middle" font-size="12" fill="#5F5E5A">10+</text><text x="40" y="166" font-size="14" font-weight="bold" fill="#2C2C2A">Points added to the score</text><text x="40" y="196" font-size="14" fill="#2C2C2A">Whole building</text><text x="330" y="196" text-anchor="end" font-size="14" font-weight="bold" fill="#2C2C2A">+3</text><text x="40" y="224" font-size="14" fill="#2C2C2A">Single apartment</text><text x="330" y="224" text-anchor="end" font-size="14" font-weight="bold" fill="#2C2C2A">+1</text><text x="40" y="252" font-size="14" fill="#2C2C2A">Heat season (Oct 1 to May 31)</text><text x="330" y="252" text-anchor="end" font-size="14" font-weight="bold" fill="#2C2C2A">+2</text><text x="40" y="280" font-size="14" fill="#2C2C2A">Outage 24 to 47 hours</text><text x="330" y="280" text-anchor="end" font-size="14" font-weight="bold" fill="#2C2C2A">+2</text><text x="40" y="308" font-size="14" fill="#2C2C2A">Outage 48 hours or more</text><text x="330" y="308" text-anchor="end" font-size="14" font-weight="bold" fill="#2C2C2A">+3</text><text x="370" y="196" font-size="14" fill="#2C2C2A">Vulnerable household</text><text x="640" y="196" text-anchor="end" font-size="14" font-weight="bold" fill="#2C2C2A">+3</text><text x="370" y="224" font-size="14" fill="#2C2C2A">Reported overnight (10pm to 6am)</text><text x="640" y="224" text-anchor="end" font-size="14" font-weight="bold" fill="#2C2C2A">+1</text><text x="370" y="252" font-size="14" fill="#2C2C2A">Repeat-offender address</text><text x="640" y="252" text-anchor="end" font-size="14" font-weight="bold" fill="#2C2C2A">+2</text><text x="370" y="280" font-size="14" fill="#2C2C2A">Ticket reopened</text><text x="640" y="280" text-anchor="end" font-size="14" font-weight="bold" fill="#2C2C2A">+2</text><rect x="40" y="336" width="600" height="116" rx="8" fill="#FCEBEB" stroke="#A32D2D"/><text x="60" y="360" font-size="14" font-weight="bold" fill="#501313">Always critical, whatever the score</text><text x="60" y="386" font-size="12" fill="#A32D2D">1. Safety risk reported (for example a gas smell)</text><text x="60" y="408" font-size="12" fill="#A32D2D">2. Vulnerable household with no heat during heat season</text><text x="60" y="430" font-size="12" fill="#A32D2D">3. Whole building that is also a repeat address, or out 24 hours or more</text></svg>